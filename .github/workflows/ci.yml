name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Renovate 44+ declares node ^24.11.0; on 22 its CLI already fails
          # (RegExp.escape), so the validator can stop working without notice.
          node-version: '24'

      - name: Validate Renovate preset
        # A malformed default.json would silently break Renovate for the whole
        # org (every repo inherits this preset). Validate it on every PR so the
        # org-wide automerge contract has a real CI gate here too.
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate/default.json

      - name: Validate this repo's Renovate config
        # With no file argument the validator checks renovate.json as a repo
        # config, the way Renovate reads it (a file argument is checked as
        # global config instead).
        run: npx --yes --package renovate -- renovate-config-validator --strict

      - name: Lint scripts
        # shellcheck ships on GitHub's ubuntu runners.
        run: shellcheck scripts/*.sh

      - name: Validate JSON files parse
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $fail
